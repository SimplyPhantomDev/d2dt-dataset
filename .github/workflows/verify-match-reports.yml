name: Verify match reports

on:
  workflow_dispatch:
  # Automatic verification is paused during development.
  # Uncomment the schedule when public match reporting launches.
  # schedule:
  #  - cron: "17 * * * *"

permissions:
  contents: read

# Prevent overlapping verification runs against the same database queue.
concurrency:
  group: match-report-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify queued match reports
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STRATZ_API_TOKEN: ${{ secrets.STRATZ_API_TOKEN }}
        run: node scripts/verifyMatchReports.cjs 50
